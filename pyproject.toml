[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rlm"
version = "0.1.0"
description = "A small, request-preserving Recursive Language Model runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexander Richard Towell", email = "lex@metafunctor.com" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "ipython>=8.0",
]

[project.optional-dependencies]
server = ["uvicorn>=0.30"]
dev = [
  "openai>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "uvicorn>=0.30",
]

[project.scripts]
rlm = "rlm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
artifacts = ["src/rlm/schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
