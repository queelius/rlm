name: pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "experiments/INDEX.md"
      - "experiments/*/EXPERIMENT.md"
      - "mkdocs.yml"
      - "scripts/build_docs.py"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.5.39 pymdown-extensions==10.11
      - run: python scripts/build_docs.py
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
